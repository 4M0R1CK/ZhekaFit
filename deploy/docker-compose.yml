services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env.local}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in .env.local}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://zhekafitness.localhost:4443}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - app

  nginx:
    image: nginx/nginx-unprivileged:1.30.6-alpine-slim
    depends_on:
      - frontend
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:4443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx-security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - app
      - edge

networks:
  app:
    internal: true
  edge:
    driver: bridge
